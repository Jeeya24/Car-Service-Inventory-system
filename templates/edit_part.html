{% extends "base.html" %}

{% block title %}Edit Part - Car Inventory{% endblock %}

{% block content %}
<div class="form-container">
    <div class="header-actions">
        <h1>Edit Part</h1>
        <a href="{{ url_for('parts') }}" class="btn btn-outline">Back to Parts</a>
    </div>

    <form method="POST" action="{{ url_for('edit_part', id=part.id) }}" class="form">
        <div class="form-group">
            <label for="part_id">Part ID</label>
            <input type="text" id="part_id" value="{{ part.part_id }}" disabled>
        </div>

        <div class="form-group">
            <label for="part_name">Part Name *</label>
            <input type="text" id="part_name" name="part_name" value="{{ part.part_name }}" required
                   pattern="[A-Za-z0-9\s\-]+" title="Only letters, numbers, spaces, and hyphens allowed">
        </div>

        <div class="form-group">
            <label for="brand">Brand *</label>
            <input type="text" id="brand" name="brand" value="{{ part.brand }}" required
                   pattern="[A-Za-z0-9\s\-]+" title="Only letters, numbers, spaces, and hyphens allowed">
        </div>

        <div class="form-group">
            <label for="price">Price ($) *</label>
            <input type="number" id="price" name="price" value="{{ part.price }}" required min="0" step="0.01"
                   title="Enter a valid price (minimum 0)">
        </div>

        <div class="form-group">
            <label for="stock_quantity">Stock Quantity *</label>
            <input type="number" id="stock_quantity" name="stock_quantity" value="{{ part.stock_quantity }}" required min="0"
                   title="Enter a valid quantity (minimum 0)">
        </div>

        <div class="form-group">
            <label for="supplier_id">Supplier</label>
            <div class="input-group">
                <select id="supplier_id" name="supplier_id" class="form-select">
                    <option value="">-- Select Supplier --</option>
                    {% for supplier in suppliers %}
                        <option value="{{ supplier.id }}"
                                {% if part.supplier_id == supplier.id %}selected{% endif %}
                                {% if supplier.preferred_supplier %}class="text-success fw-bold"{% endif %}>
                            {{ supplier.supplier_name }} {% if supplier.preferred_supplier %}(Preferred){% endif %}
                        </option>
                    {% endfor %}
                </select>
                <button type="button" class="btn btn-outline-secondary" id="addSupplierBtn" data-bs-toggle="modal" data-bs-target="#addSupplierModal">
                    <i class="fas fa-plus"></i> Add New
                </button>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Update Part</button>
            <a href="{{ url_for('parts') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
<!-- Add Supplier Modal -->
<div class="modal fade" id="addSupplierModal" tabindex="-1" aria-labelledby="addSupplierModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addSupplierModalLabel">Add New Supplier</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="quickAddSupplierForm">
                    <div class="mb-3">
                        <label for="supplier_name" class="form-label">Supplier Name *</label>
                        <input type="text" class="form-control" id="supplier_name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email *</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-label">Phone *</label>
                        <input type="tel" class="form-control" id="phone" required>
                    </div>
                    <div class="mb-3">
                        <label for="delivery_lead_time" class="form-label">Delivery Lead Time (days)</label>
                        <input type="number" class="form-control" id="delivery_lead_time" min="1" value="1">
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="preferred_supplier">
                        <label class="form-check-label" for="preferred_supplier">Preferred Supplier</label>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveSupplierBtn">Save Supplier</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Form validation
    document.querySelector('form').addEventListener('submit', function(e) {
        const price = parseFloat(document.getElementById('price').value);
        const stock = parseInt(document.getElementById('stock_quantity').value);

        if (price < 0) {
            e.preventDefault();
            alert('Price cannot be negative');
            return;
        }

        if (stock < 0) {
            e.preventDefault();
            alert('Stock quantity cannot be negative');
            return;
        }
    });

    // Quick add supplier functionality
    const saveSupplierBtn = document.getElementById('saveSupplierBtn');
    saveSupplierBtn.addEventListener('click', function() {
        const supplierName = document.getElementById('supplier_name').value;
        const email = document.getElementById('email').value;
        const phone = document.getElementById('phone').value;
        const deliveryLeadTime = document.getElementById('delivery_lead_time').value;
        const preferredSupplier = document.getElementById('preferred_supplier').checked;

        // Validate form
        if (!supplierName || !email || !phone) {
            alert('Please fill in all required fields');
            return;
        }

        // Send AJAX request to add supplier
        fetch('/api/suppliers/quick-add', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                supplier_name: supplierName,
                email: email,
                phone: phone,
                delivery_lead_time: deliveryLeadTime,
                preferred_supplier: preferredSupplier
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                // Add new supplier to dropdown
                const supplierDropdown = document.getElementById('supplier_id');
                const option = document.createElement('option');
                option.value = data.supplier.id;
                option.textContent = data.supplier.supplier_name + (data.supplier.preferred_supplier ? ' (Preferred)' : '');
                if (data.supplier.preferred_supplier) {
                    option.classList.add('text-success', 'fw-bold');
                }
                supplierDropdown.appendChild(option);

                // Select the new supplier
                supplierDropdown.value = data.supplier.id;

                // Close modal
                bootstrap.Modal.getInstance(document.getElementById('addSupplierModal')).hide();

                // Show success message
                alert(data.message);

                // Reset form
                document.getElementById('quickAddSupplierForm').reset();
            } else {
                alert(data.message);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('An error occurred while adding the supplier');
        });
    });
});
</script>
{% endblock %}
